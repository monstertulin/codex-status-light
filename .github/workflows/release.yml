name: Release Tauri App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --bundles app,dmg --target aarch64-apple-darwin
          - platform: macos-latest
            args: --bundles app,dmg --target x86_64-apple-darwin
          - platform: windows-latest
            args: --bundles msi,nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/status-light-shell/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/status-light-shell/src-tauri -> target

      - name: Install app dependencies
        run: npm --prefix apps/status-light-shell ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/status-light-shell
          tagName: v__VERSION__
          releaseName: Codex Status Light v__VERSION__
          releaseBody: |
            Cross-platform tray builds for Codex Status Light.

            Downloads:
            - macOS: `.dmg`
            - Windows: `.msi` or `NSIS .exe`

            Notes:
            - The app needs local Codex runtime data under the current user's `.codex` directory.
            - Unsigned builds may show first-launch platform warnings.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
