[package]
name = "codex-status-light-shell"
version = "0.1.0"
edition = "2021"
description = "Cross-platform tray shell for the Codex status light"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "tray-icon"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
tray-icon = { path = "../vendor/tray-icon-0.23.1" }
